<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сигнал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #27ae60;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            border: 1px solid rgba(39,174,96,0.5);
            background-color: rgba(0, 20, 0, 0.25);
            padding: 40px;
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
            position: relative;
        }

            .container::before {
                content: '';
                position: absolute;
                top: -2px;
                left: -2px;
                right: -2px;
                bottom: -2px;
                background: linear-gradient(45deg, rgba(39,174,96,0.4), rgba(0,204,0,0.25), rgba(0,153,0,0.2), rgba(39,174,96,0.4));
                background-size: 400% 400%;
                z-index: -1;
                animation: borderGlow 6s ease infinite;
                border-radius: 4px;
            }

        @keyframes borderGlow {
            0%,100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        h1 {
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(39,174,96,0.7);
        }

        .color-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 30px 0;
            text-shadow: 0 0 15px rgba(39,174,96,0.7);
        }

        button {
            background: rgba(0, 50, 0, 0.7);
            border: 1px solid #27ae60;
            color: #27ae60;
            font-family: inherit;
            font-size: 1.2rem;
            padding: 10px 20px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(39,174,96,0.5);
        }

            button:hover {
                background: rgba(0,100,0,0.9);
                box-shadow: 0 0 20px rgba(39,174,96,0.8);
            }

            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сигнал</h1>
        <div class="color-display">Начинаем?</div>
        <button id="spin">Пуск</button>
    </div>

    <script>
        const colors = [
            { name: "Оранжевый", value: "orange" },
            { name: "Зелёный", value: "green" },
            { name: "Синий", value: "blue" },
            { name: "Жёлтый", value: "yellow" }
        ];
        let remainingColors = [...colors];

        const display = document.querySelector(".color-display");
        const button = document.getElementById("spin");

        button.addEventListener("click", () => {
            if (remainingColors.length === 0) {
                display.textContent = "Все цвета использованы!";
                button.disabled = true;
                return;
            }

            // Выбираем случайный цвет
            const randomIndex = Math.floor(Math.random() * remainingColors.length);
            const chosenColor = remainingColors[randomIndex];

            // Удаляем его из списка
            remainingColors.splice(randomIndex, 1);

            let flashes = 15; // количество миганий
            let interval = setInterval(() => {
                const random = colors[Math.floor(Math.random() * colors.length)];
                document.body.style.backgroundColor = random.value;
                display.textContent = random.name;
                display.style.color = random.value;
            }, 150);

            setTimeout(() => {
                clearInterval(interval);
                // Оставляем выбранный цвет
                document.body.style.backgroundColor = chosenColor.value;
                display.textContent = chosenColor.name;
                display.style.color = chosenColor.value;
            }, flashes * 150);
        });
    </script>
</body>
</html>
