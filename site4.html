<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система 00_12</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #27ae60;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(0,255,0,0.05) 1px, transparent 1px), radial-gradient(circle at 80% 70%, rgba(0,255,0,0.03) 1px, transparent 1px);
            background-size: 50px 50px, 70px 70px;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(39,174,96,0.5);
            padding: 30px;
            background-color: rgba(0, 20, 0, 0.25);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
            position: relative;
        }

            .container::before {
                content: '';
                position: absolute;
                top: -2px;
                left: -2px;
                right: -2px;
                bottom: -2px;
                background: linear-gradient(45deg, rgba(39,174,96,0.4), rgba(0,204,0,0.25), rgba(0,153,0,0.2), rgba(39,174,96,0.4));
                background-size: 400% 400%;
                z-index: -1;
                animation: borderGlow 6s ease infinite;
                border-radius: 4px;
            }

        @keyframes borderGlow {
            0%,100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .system-title {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(39,174,96,0.7);
        }

        .message-line {
            margin-bottom: 15px;
            font-size: 1.2rem;
            opacity: 0;
            border-left: 2px solid rgba(39,174,96,0.6);
            padding-left: 15px;
            position: relative;
            white-space: pre-wrap;
        }

            .message-line::before {
                content: '>';
                position: absolute;
                left: 5px;
                color: rgba(39,174,96,0.7);
            }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: #27ae60;
            margin-left: 2px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%,50% {
                opacity: 1;
            }

            51%,100% {
                opacity: 0;
            }
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to bottom, transparent, rgba(39,174,96,0.7), transparent);
            animation: scan 3s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -2px;
            }

            100% {
                top: 100%;
            }
        }

        @media (max-width: 768px) {
            .system-title {
                font-size: 1.5rem;
            }

            .message-line {
                font-size: 1rem;
            }
        }

        img {
            max-width: 100%;
            margin-top: 20px;
            border: 1px solid rgba(39,174,96,0.5);
            box-shadow: 0 0 15px rgba(0,255,0,0.2);
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div class="container">
        <h1 class="system-title">Система 00_12 перезапущена</h1>
        <img src="images/шрек.jpeg" alt="image">
    </div>
</body>
</html>
